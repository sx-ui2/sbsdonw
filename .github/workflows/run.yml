name: Check SBS Links

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '基础URL（必须包含 {last3} 作为占位符）'
        required: true
        default: 'https://opsvod.sbs.co.kr/pooq/sbs/202109/08/1920X1080_256_402356662_2021-09-08-15122{last3}.mp4/content_0.ts'

jobs:
  run-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run check script
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: python check.py
