name: Check SBS Links

on:
  workflow_dispatch:
    inputs:
      raw_url:
        description: '带 token 的原始完整链接'
        required: true
        default: 'https://opsvod.sbs.co.kr/Media/sbs/201901/01/640X360_96000_437448218_2019-01-01-013117572.mp4/playlist.m3u8?token=xxx'
      specified_tail:
        description: '倒数第4位(及之前)的数字（填 1 就是倒数第4位是 1；填 10 就是倒数第5位是 1，第4位是 0）'
        required: true
        default: '1'

jobs:
  run-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run check script
        env:
          RAW_URL: ${{ github.event.inputs.raw_url }}
          SPECIFIED_TAIL: ${{ github.event.inputs.specified_tail }}
        run: python check.py
